version: "4.0.10"
name: Simple Scheduler
description: Entities Scheduler
slug: simplescheduler
url: https://github.com/arthurdent75/SimpleScheduler
image: ghcr.io/arthurdent75/simplescheduler
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
ingress: true
panel_admin: false
panel_title: Scheduler
panel_icon: mdi:calendar-clock
services:
  - mqtt:need 
map:
  - app_config:rw
  - share:rw
options: {}
schema:
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
